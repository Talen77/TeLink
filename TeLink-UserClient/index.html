<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TeLink 房间客户端</title>
  <style>
    body { font-family: sans-serif; margin: 24px; max-width: 720px; }
    label { display: block; margin: 12px 0; }
    input, button { font: inherit; }
    pre { background: #f4f4f5; padding: 12px; min-height: 180px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>TeLink 房间客户端</h1>
  <p>打开两个页面，进入同一个房间后发送消息。需要推送节点以 <code>-Dtelink.room.enabled=true</code> 启动，并另起业务进程。</p>
  <label>WebSocket <input id="endpoint" value="ws://127.0.0.1:8082/ws" size="40" /></label>
  <label>房间 ID <input id="roomId" value="1001" /></label>
  <label>用户 ID <input id="userId" value="42" /></label>
  <button id="connect" type="button">连接</button>
  <button id="create" type="button">新建并进入</button>
  <button id="join" type="button">加入房间</button>
  <label>消息 <input id="content" value="hello" size="40" /></label>
  <button id="send" type="button">发送</button>
  <pre id="log"></pre>
  <script>
    let socket;
    const log = document.querySelector('#log');
    function write(line) {
      log.textContent = line + '\n' + log.textContent;
    }
    function roomId() { return Number(document.querySelector('#roomId').value); }
    function userId() {
      const value = document.querySelector('#userId').value.trim();
      return value ? Number(value) : undefined;
    }
    document.querySelector('#connect').onclick = () => {
      if (socket) socket.close();
      socket = new WebSocket(document.querySelector('#endpoint').value);
      socket.onopen = () => write('已连接');
      socket.onclose = () => write('连接关闭');
      socket.onerror = () => write('连接异常');
      socket.onmessage = (event) => write(event.data);
    };
    document.querySelector('#create').onclick = () => socket.send(JSON.stringify({
      type: 'CREATE_ROOM', roomId: roomId(), userId: userId()
    }));
    document.querySelector('#join').onclick = () => socket.send(JSON.stringify({
      type: 'JOIN_ROOM', roomId: roomId(), userId: userId()
    }));
    document.querySelector('#send').onclick = () => socket.send(JSON.stringify({
      type: 'CHAT_MESSAGE',
      messageId: crypto.randomUUID(),
      roomId: roomId(),
      userId: userId(),
      content: document.querySelector('#content').value,
      sentAt: Date.now()
    }));
  </script>
</body>
</html>
