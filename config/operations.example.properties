# Merge into config/local.properties. Do not overwrite existing connection settings.
# Priority: JVM property > environment > local.properties > default.
# All Starter nodes must share the same telink.log.mysql.* database.
# First run TeLink-Common/src/main/resources/sql/agent_operation.sql in that database.

telink.agent.operations.enabled=true
# Set a private random value (e.g. openssl rand -hex 32). Never put this in VITE_* or prompts.
# Provide it separately to authorized reviewers. An empty key disables review/proposals.
telink.agent.operations.reviewKey=
telink.agent.operations.approvalSeconds=600
telink.agent.operations.executionSeconds=120
telink.agent.operations.cooldownSeconds=300

# Unique per deployed node, stable across JVM restarts; do NOT share between replicas.
telink.node.deploymentId=push-node-a
# Restart is unavailable until a real fixed restart entry point is configured.
# JSON argv array, with no shell expansion or model-controlled arguments.
telink.node.operations.restartCommand=[]
# Example shape only: supply a real script for your process manager and this one node.
# telink.node.operations.restartCommand=["/opt/bullet/bin/restart-this-node"]
# The script must arrange for a NEW JVM to start even after the current JVM stops.
# Do not use a bare kill/exit command, and do not point this at an entire cluster.
