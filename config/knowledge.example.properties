# Merge needed entries into config/local.properties; do not overwrite existing settings.
# Priority: JVM properties > environment variables > config/local.properties > defaults.

# Shared by Starter and MCP; also the server-side Bearer key in Knowledge.
telink.knowledge.endpoint=http://127.0.0.1:9093
telink.knowledge.apiKey=replace-with-a-shared-secret

# Knowledge service (use an absolute persistent path in deployment).
telink.knowledge.host=127.0.0.1
telink.knowledge.port=9093
telink.knowledge.storagePath=.data/knowledge

# Optional: omit all three to reuse telink.log.mysql.* / TELINK_LOG_MYSQL_*.
telink.knowledge.mysql.url=jdbc:mysql://127.0.0.1:3306/telink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
telink.knowledge.mysql.user=your-app-user
telink.knowledge.mysql.password=your-db-password

# These topics are independent of message_in / message_out.
# Same cloud broker as the push node and business service defaults.
telink.knowledge.kafka.bootstrapServers=127.0.0.1:9092
telink.knowledge.kafka.topic=knowledge_ingest
telink.knowledge.kafka.deadLetterTopic=knowledge_ingest_dlq
telink.knowledge.kafka.group=knowledge-indexer
telink.knowledge.kafka.securityProtocol=PLAINTEXT
# telink.knowledge.kafka.saslMechanism=PLAIN
# telink.knowledge.kafka.saslJaasConfig=org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="secret";

# Full embeddings HTTP URL, not the chat/completions URL.
# The endpoint accepts {model,input:[text...],encoding_format:"float"}.
telink.knowledge.embedding.url=http://your-embedding-host:8000/v1/embeddings
telink.knowledge.embedding.apiKey=your-embedding-key
telink.knowledge.embedding.model=your-embedding-model
# Must equal the actual output dimension of the configured model.
telink.knowledge.embedding.dimensions=1024
# Increase after replacing model weights behind the same model name.
telink.knowledge.embedding.revision=1

# Qdrant with Query API and sparse-vector IDF support (1.10+).
telink.knowledge.qdrant.url=http://127.0.0.1:6333
telink.knowledge.qdrant.collection=telink_knowledge
# telink.knowledge.qdrant.apiKey=your-qdrant-key

# Character-based chunks; overlap applies within long paragraphs.
telink.knowledge.chunk.size=1200
telink.knowledge.chunk.overlap=150
telink.knowledge.maxTextChars=200000
telink.knowledge.maxAttempts=3
telink.knowledge.txt.charset=UTF-8

# Starter: automatic initial retrieval plus ReAct follow-up retrieval.
agent.rag.enabled=true
# MCP: if an explicit allowlist already exists, append search_knowledge to it.
telink.mcp.tools=query_push_logs_by_log_id,query_project_code,list_push_nodes,query_node_metrics,search_knowledge
